[package]
name = "atlas-server"
description = "Flux Atlas HTTP/WebSocket server and the `atlas` binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "atlas"
path = "src/main.rs"

[features]
default = ["embed-web"]
# Serve `web/dist` from the binary. In debug builds rust-embed reads the directory at run time;
# release builds embed it. Without the feature (or with an empty dist) a placeholder page is served.
embed-web = ["dep:rust-embed"]

[dependencies]
atlas-core = { path = "../atlas-core" }
atlas-flux = { path = "../atlas-flux" }
atlas-store = { path = "../atlas-store" }
atlas-engine = { path = "../atlas-engine" }
anyhow.workspace = true
arc-swap.workspace = true
axum = { workspace = true, features = ["matched-path"] }
blake3.workspace = true
brotli.workspace = true
bytes.workspace = true
clap.workspace = true
compact_str.workspace = true
flate2.workspace = true
futures-util.workspace = true
governor.workspace = true
hex.workspace = true
http.workspace = true
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
mime_guess = "2.0.5"
mimalloc.workspace = true
moka = { version = "0.12.16", features = ["future"] }
rustix = { version = "1.1.5", features = ["process", "thread"] }
rust-embed = { version = "8.7", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tokio = { workspace = true, features = ["io-util"] }
tower-service = "0.3.3"
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
http-body-util = "0.1.3"
tokio-tungstenite.workspace = true
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
